name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      lat:
        description: Широта
        default: "55.75"
      lon:
        description: Долгота
        default: "37.62"
      days:
        description: Количество суток прогноза (limit)
        default: "7"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: mvn -B verify

  # Реальный запрос к API только по ручному запуску, чтобы не тратить лимит ключа на каждый push
  forecast:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    env:
      YANDEX_WEATHER_KEY: ${{ secrets.YANDEX_WEATHER_KEY }}
      WEATHER_QUERY_LAT: ${{ inputs.lat }}
      WEATHER_QUERY_LON: ${{ inputs.lon }}
      WEATHER_QUERY_DAYS: ${{ inputs.days }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Check secret
        run: |
          if [ -z "$YANDEX_WEATHER_KEY" ]; then
            echo "::error::Секрет YANDEX_WEATHER_KEY не задан (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - name: Package
        run: mvn -B -q -DskipTests package
      - name: Fetch forecast
        run: java -jar target/yandex-weather-service-*.jar
